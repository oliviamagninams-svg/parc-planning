<!DOCTYPE html>

<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcPlan — Parc Animalier Ginasservis</title>
<meta name="theme-color" content="#1a1a2e">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--card:#1e1e35;--card2:#252540;
  --border:#2d2d4e;--border2:#3d3d6e;
  --text:#e8e8f0;--text2:#9090b0;--text3:#6060a0;
  --green:#1fba85;--green-l:rgba(31,186,133,.15);--green-d:#0d8a60;
  --amber:#e8a020;--amber-l:rgba(232,160,32,.15);
  --red:#e05050;--red-l:rgba(224,80,80,.15);
  --blue:#4090e0;--blue-l:rgba(64,144,224,.15);
  --purple:#8060d0;--purple-l:rgba(128,96,208,.15);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;background:var(--bg)}
.login-logo .fallback{width:80px;height:80px;border-radius:50%;background:var(--green-l);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px}
.login-title{font-size:24px;font-weight:700;color:var(--green);text-align:center;margin-bottom:2px}
.login-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-bottom:20px}
.user-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s}
.user-card:hover{border-color:var(--green);background:var(--card2);transform:translateY(-2px)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.uname{font-size:13px;font-weight:600;color:var(--text);text-align:center}
.urole{font-size:11px;color:var(--text2);text-align:center}
.pin-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:300px;text-align:center}
.pin-who{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.pin-inst{font-size:12px;color:var(--text2);margin-bottom:16px}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s}
.dot.on{background:var(--green);border-color:var(--green)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkey{padding:14px 0;border:1px solid var(--border);border-radius:12px;background:var(--bg3);font-size:18px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s}
.pkey:hover{background:var(--green-l);border-color:var(--green);color:var(--green)}
.pkey:active{transform:scale(.94)}
.pin-err{font-size:12px;color:var(--red);margin-top:10px;min-height:18px}
.back-btn{margin-top:12px;font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline}

/* ── APP ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.top-name{font-size:15px;font-weight:700;color:var(--text)}
.top-role{font-size:11px;color:var(--text2)}
.logout{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
.logout:hover{background:var(--red-l);border-color:var(--red);color:var(--red)}
.tabs{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 12px}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none}
.tab.on{color:var(--green);border-bottom-color:var(--green)}
.content{flex:1;padding:16px;max-width:720px;margin:0 auto;width:100%}

/* ── DATE BANNER ── */
.date-banner{background:linear-gradient(135deg,#1a2a3a,#0d1f2d);border:1px solid var(--green-d);border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.date-big{font-size:18px;font-weight:700;color:var(--green);text-transform:capitalize}
.date-small{font-size:12px;color:var(--text2);margin-top:2px}
.time-now{font-size:26px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.time-label{font-size:10px;color:var(--text2);text-align:right}

/* ── ALERTS ── */
.alert{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;display:flex;align-items:flex-start;gap:8px;border:1px solid}
.alert.danger{background:var(--red-l);color:#ff8080;border-color:rgba(224,80,80,.3)}
.alert.warn{background:var(--amber-l);color:#ffc060;border-color:rgba(232,160,32,.3)}
.alert.ok{background:var(--green-l);color:var(--green);border-color:rgba(31,186,133,.3)}
.alert.info{background:var(--blue-l);color:#70b0ff;border-color:rgba(64,144,224,.3)}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat-n{font-size:24px;font-weight:700}
.stat-l{font-size:10px;color:var(--text2);margin-top:2px}
.cg{color:var(--green)}.ca{color:var(--amber)}.cr{color:var(--red)}.cb{color:var(--blue)}
.progbar{height:6px;background:var(--card2);border-radius:3px;margin-bottom:14px;overflow:hidden}
.progfill{height:100%;background:var(--green);border-radius:3px;transition:width .5s}

/* ── FILTERS ── */
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;transition:all .15s}
.fbtn.on{background:var(--green-l);color:var(--green);border-color:var(--green);font-weight:600}

/* ── TASKS ── */
.task{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:all .2s}
.task.done{border-color:var(--green-d);background:rgba(31,186,133,.07)}
.task.late{border-color:var(--red);background:var(--red-l);animation:blink 2s infinite}
@keyframes blink{0%,100%{border-color:rgba(224,80,80,.4)}50%{border-color:var(--red)}}
.ck{width:28px;height:28px;min-width:28px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;margin-top:2px}
.ck.done{background:var(--green);border-color:var(--green);color:#fff}
.ck.late{background:var(--red);border-color:var(--red);color:#fff}
.task-body{flex:1;min-width:0}
.task-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.task-name{font-size:14px;font-weight:600;color:var(--text)}
.task-name.done{text-decoration:line-through;color:var(--text2)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.bm{background:var(--blue-l);color:#70b0ff}
.bmi{background:var(--amber-l);color:#ffc060}
.bs{background:var(--purple-l);color:#c090ff}
.bc{background:var(--green-l);color:var(--green)}
.blate{background:var(--red-l);color:#ff8080}
.task-meta{font-size:12px;color:var(--text2);margin-top:3px}
.task-stamp{font-size:11px;color:var(--green);margin-top:3px;font-weight:500}
.task-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mod-btn{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);color:var(--text2);cursor:pointer}
.mod-btn:hover{border-color:var(--amber);color:var(--amber)}
.mod-form{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mod-form .full{grid-column:1/-1}
.mfinput{width:100%;font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.mfinput:focus{outline:none;border-color:var(--green)}
.mfselect{width:100%;font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.mf-save{padding:5px 14px;border-radius:7px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.mf-cancel{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer}

/* ── OBSERVATION ── */
.obs-card{background:var(--card);border:1.5px solid var(--amber);border-radius:14px;padding:14px;margin-top:16px}
.obs-card.saved{border-color:var(--green)}
.obs-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.obs-req{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--amber-l);color:var(--amber);font-weight:700}
.obs-req.ok{background:var(--green-l);color:var(--green)}
.obs-sub{font-size:12px;color:var(--text2);margin-bottom:10px}
.obs-ta{width:100%;min-height:80px;resize:vertical;border-radius:10px;border:1px solid var(--border);padding:10px;font-size:13px;color:var(--text);background:var(--bg3)}
.obs-ta:focus{outline:none;border-color:var(--green)}
.obs-save{margin-top:10px;padding:8px 20px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer}

/* ── WEEK ── */
.week-wrap{overflow-x:auto}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));gap:4px;min-width:560px}
.day-col{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.day-hd{padding:8px 4px;text-align:center;background:var(--card2)}
.day-hd.today{background:rgba(31,186,133,.2);border-bottom:2px solid var(--green)}
.day-dn{font-size:10px;font-weight:600;color:var(--text2)}
.day-dt{font-size:14px;font-weight:700;color:var(--text)}
.day-hd.today .day-dn,.day-hd.today .day-dt{color:var(--green)}
.day-task{font-size:10px;padding:3px 5px;margin:3px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-ok{background:var(--green-l);color:var(--green)}
.dt-late{background:var(--red-l);color:#ff8080}
.dt-pend{background:var(--card2);color:var(--text2)}
.week-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px}

/* ── ADMIN ── */
.section-hd{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 10px;display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.emp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.emp-body{flex:1;min-width:0}
.emp-name{font-size:14px;font-weight:700;color:var(--text)}
.emp-role{font-size:12px;color:var(--text2);margin-bottom:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.pill-g{background:var(--green-l);color:var(--green)}
.pill-r{background:var(--red-l);color:#ff8080}
.pill-a{background:var(--amber-l);color:var(--amber)}
.pill-b{background:var(--blue-l);color:#70b0ff}
.obs-read{background:var(--bg3);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--text2);border-left:3px solid var(--green)}
.task-param{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.task-param-body{flex:1}
.task-param-name{font-size:13px;font-weight:600;color:var(--text)}
.task-param-meta{font-size:11px;color:var(--text2);margin-top:2px}
.task-param-days{font-size:11px;color:var(--blue);margin-top:2px}
.del-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--red-l);background:var(--red-l);color:#ff8080;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.del-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.add-form{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px}
.add-form-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.finput{width:100%;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.finput:focus{outline:none;border-color:var(--green)}
.fselect{width:100%;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.flabel{font-size:11px;color:var(--text2);margin-bottom:3px;display:block;font-weight:600}
.save-btn{padding:9px 18px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.save-btn:hover{opacity:.85}
.save-btn.blue{background:var(--blue)}
.save-btn.gray{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.day-toggle{padding:7px 4px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;color:var(--text2);transition:all .15s}
.day-toggle.on{background:var(--green-l);border-color:var(--green);color:var(--green)}

/* ── ALERT SETTINGS ── */
.alert-box-admin{background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:16px;margin-bottom:10px}
.alert-box-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:12px}
.contact-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.contact-label{font-size:12px;font-weight:600;color:var(--text);width:90px;flex-shrink:0}
.contact-input{flex:1;min-width:160px;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.contact-input:focus{outline:none;border-color:var(--blue)}
.notif-toggle{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);font-size:11px;font-weight:600;cursor:pointer;color:var(--text2)}
.notif-toggle.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.save-contact-btn{padding:8px 18px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
.info-tip{font-size:11px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:8px 10px;margin-top:10px;border-left:3px solid var(--border2)}

/* ── NOTIF BANNER ── */
.notif-banner{background:var(--red);color:#fff;padding:12px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:0 0 12px 12px;margin:-1px 0 0}
.close-notif{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.notif-warn{background:var(--amber)}

.empty{text-align:center;padding:2rem;color:var(--text2);font-size:13px}
.saved-ok{font-size:12px;color:var(--green);font-weight:600}

@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:1}
  .date-banner{flex-direction:column;gap:8px}
}
</style>
</head>
<body>

<div id="notif-zone"></div>

<!-- LOGIN -->
<div id="login">
  <div class="login-logo"><div class="fallback">🐾</div></div>
  <div class="login-title">ParcPlan</div>
  <div class="login-sub">Parc Animalier Ginasservis</div>
  <div class="user-grid" id="user-grid">
    <div class="user-card" onclick="selectUser(&#39;myriam&#39;)">
      <div class="avatar" style="background:#3a2a10;color:#e8a020">MY</div>
      <div class="uname">Myriam</div>
      <div class="urole">Responsable / Admin</div>
    </div>
    <div class="user-card" onclick="selectUser(&#39;sophie&#39;)">
      <div class="avatar" style="background:#0a2a1a;color:#1fba85">SO</div>
      <div class="uname">Sophie</div>
      <div class="urole">Soigneuse animaux</div>
    </div>
    <div class="user-card" onclick="selectUser(&#39;lucas&#39;)">
      <div class="avatar" style="background:#0a1a3a;color:#4090e0">LU</div>
      <div class="uname">Lucas</div>
      <div class="urole">Agent entretien</div>
    </div>
    <div class="user-card" onclick="selectUser(&#39;emma&#39;)">
      <div class="avatar" style="background:#2a1a3a;color:#c090ff">EM</div>
      <div class="uname">Emma</div>
      <div class="urole">Soigneuse &amp; accueil</div>
    </div>
    <div class="user-card" onclick="selectUser(&#39;kevin&#39;)">
      <div class="avatar" style="background:#3a1a1a;color:#ff8080">KÉ</div>
      <div class="uname">Kévin</div>
      <div class="urole">Agent polyvalent</div>
    </div>
    <div class="user-card" onclick="selectUser(&#39;lea&#39;)">
      <div class="avatar" style="background:#1a2a0a;color:#90d040">LÉ</div>
      <div class="uname">Léa</div>
      <div class="urole">Stagiaire / Accueil</div>
    </div></div>
  <div class="pin-box hidden" id="pin-box">
    <div class="pin-who" id="pin-who"></div>
    <div class="pin-inst">Code PIN à 4 chiffres</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-pad" id="pin-pad"><button class="pkey" onclick="pinPress(&#39;1&#39;)">1</button><button class="pkey" onclick="pinPress(&#39;2&#39;)">2</button><button class="pkey" onclick="pinPress(&#39;3&#39;)">3</button><button class="pkey" onclick="pinPress(&#39;4&#39;)">4</button><button class="pkey" onclick="pinPress(&#39;5&#39;)">5</button><button class="pkey" onclick="pinPress(&#39;6&#39;)">6</button><button class="pkey" onclick="pinPress(&#39;7&#39;)">7</button><button class="pkey" onclick="pinPress(&#39;8&#39;)">8</button><button class="pkey" onclick="pinPress(&#39;9&#39;)">9</button><button class="pkey" onclick="pinPress(&#39;&#39;)"></button><button class="pkey" onclick="pinPress(&#39;0&#39;)">0</button><button class="pkey" onclick="pinPress(&#39;⌫&#39;)">⌫</button></div>
    <div class="pin-err" id="pin-err"></div>
    <button class="back-btn" onclick="cancelPin()">← Retour</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <div class="avatar" id="tb-avatar"></div>
      <div><div class="top-name" id="tb-name"></div><div class="top-role" id="tb-role"></div></div>
    </div>
    <button class="logout" onclick="logout()">⏻ Quitter</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content">
    <div id="view-jour"></div>
    <div id="view-semaine" class="hidden"></div>
    <div id="view-admin" class="hidden"></div>
  </div>
</div>

<script>
// ══ DATA ═════════════════════════════════════════════════════════════════════
let USERS=[

// ── Helpers ──────────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const nm=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const toMin=s=>s?Number(s.split(':')[0])*60+Number(s.split(':')[1]):99999;
const todayDow=()=>new Date().getDay();
const todayKey=()=>new Date().toISOString().slice(0,10);
const initials=n=>n.slice(0,2).toUpperCase();
const getUser=id=>USERS.find(u=>u.id===id);
const slotLabel=s=>s==='matin'?'Matin':s==='midi'?'Midi':s==='soir'?'Soir':'Continu';
const slotBadge=s=>s==='matin'?'bm':s==='midi'?'bmi':s==='soir'?'bs':'bc';

function getTodaySlot(t){
  if(t.todayOverride) return t.todayOverride;
  return t.days.find(d=>d.dow===todayDow())||null;
}
function isTaskToday(t){ return !!getTodaySlot(t); }
function isLate(t){
  if(t.done) return false;
  const s=getTodaySlot(t); if(!s) return false;
  return nm()>toMin(s.pMax);
}
function daysLabel(t){
  const dows=t.days.map(d=>d.dow);
  if(dows.length===7) return 'Tous les jours';
  return [1,2,3,4,5,6,0].filter(d=>dows.includes(d)).map(d=>DAYS_FR[d]).join(', ');
}
function formatDate(){
  const d=new Date();
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function formatTime(){
  return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function getWeekNum(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));
  const y=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y)/86400000)+1)/7);
}

// ── Notifs visuelles ─────────────────────────────────────────────────────────
function showNotif(msg, type='danger'){
  const z=$('notif-zone');
  const div=document.createElement('div');
  div.className='notif-banner'+(type==='warn'?' notif-warn':'');
  div.innerHTML=`<span>${msg}</span><button class="close-notif" onclick="this.parentNode.remove()">✕</button>`;
  z.appendChild(div);
  setTimeout(()=>div.remove(), 7000);
}

function checkAlerts(){
  if(!STATE.user) return;
  const myT=STATE.user.admin?TASKS:TASKS.filter(t=>t.who===STATE.user.id);
  const late=myT.filter(t=>isTaskToday(t)&&isLate(t));
  if(late.length>0) showNotif('⚠️ '+late.length+' tâche'+(late.length>1?'s':'')+' en retard : '+late.map(t=>t.name).join(', '));
  const h=new Date().getHours();
  if(h>=parseInt(ALERTS.obsH)&&!OBS[todayKey()+STATE.user.id])
    showNotif('📝 Observation de fin de journée non remplie !','warn');
}

function renderDots(){$('pin-dots').innerHTML=[0,1,2,3].map(i=>`<div class="dot${i<STATE.pin.length?' on':''}"></div>`).join('');}
function selectUser(id){

  STATE.pinTarget=null;STATE.pin='';
  $('pin-box').classList.add('hidden');$('user-grid').classList.remove('hidden');
}
function pinPress(v){
  if(v==='') return;
  if(v==='⌫'){STATE.pin=STATE.pin.slice(0,-1);renderDots();return;}
  if(STATE.pin.length>=4) return;
  STATE.pin+=String(v);renderDots();
  if(STATE.pin.length===4){
    setTimeout(()=>{
      if(STATE.pin===STATE.pinTarget.pin) doLogin(STATE.pinTarget);
      else{$('pin-err').textContent='Code incorrect';STATE.pin='';renderDots();}
    },250);
  }
}
function doLogin(u){
  STATE.user=u;
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('tb-avatar').textContent=initials(u.name);

// ── JOUR ─────────────────────────────────────────────────────────────────────
function renderJour(){
  const u=STATE.user;
  let myT=u.admin?TASKS:TASKS.filter(t=>t.who===u.id);
  let todayT=myT.filter(t=>isTaskToday(t));
  let visible=[...todayT];
  if(STATE.filter==='late') visible=visible.filter(t=>isLate(t));
  else if(STATE.filter!=='all') visible=visible.filter(t=>t.slot===STATE.filter);

  const done=todayT.filter(t=>t.done).length;
  const late=todayT.filter(t=>isLate(t)).length;
  const att=todayT.filter(t=>!t.done&&!isLate(t)).length;
  const pct=todayT.length?Math.round(done/todayT.length*100):0;
  const obsKey=todayKey()+u.id;
  const savedObs=OBS[obsKey]||'';
  const dateStr=formatDate();
  const dateCap=dateStr.charAt(0).toUpperCase()+dateStr.slice(1);

  let h=`<div class="date-banner">
    <div>
      <div class="date-big">${dateCap}</div>
      <div class="date-small">Semaine ${getWeekNum(new Date())} · ${DAYS_FULL[todayDow()]}</div>
    </div>
    <div style="text-align:right">
      <div class="time-now" id="live-time">${formatTime()}</div>
      <div class="time-label">heure actuelle</div>
    </div>
  </div>`;

  if(late>0) h+=`<div class="alert danger">🔴 <strong>${late} tâche${late>1?'s':''} en retard</strong> — à effectuer immédiatement</div>`;
  if(!savedObs&&new Date().getHours()>=parseInt(ALERTS.obsH)) h+=`<div class="alert warn">📝 Observation de fin de journée <strong>obligatoire</strong> — non remplie</div>`;
  if(att>0&&late===0&&done>0) h+=`<div class="alert info">⏰ ${att} tâche${att>1?'s':''} restante${att>1?'s':''} aujourd'hui</div>`;
  if(done===todayT.length&&todayT.length>0&&savedObs) h+=`<div class="alert ok">✅ Journée complète ! Bravo.</div>`;

  h+=`<div class="stats">
    <div class="stat"><div class="stat-n cg">${done}</div><div class="stat-l">Faites</div></div>
    <div class="stat"><div class="stat-n ca">${att}</div><div class="stat-l">En attente</div></div>
    <div class="stat"><div class="stat-n cr">${late}</div><div class="stat-l">En retard</div></div>
    <div class="stat"><div class="stat-n cb">${todayT.length}</div><div class="stat-l">Aujourd'hui</div></div>
  </div>
  <div class="progbar"><div class="progfill" style="width:${pct}%"></div></div>
  <div class="filters">${['all','matin','midi','soir','continu','late'].map(f=>`<button class="fbtn${STATE.filter===f?' on':''}" onclick="setFilter('${f}')">${f==='all'?'Toutes':f==='late'?'⚠ Retard':f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}</div>`;

  if(visible.length===0){h+=`<div class="empty">Aucune tâche pour ce filtre aujourd'hui</div>`;}
  else{
    h+=visible.map(t=>{
      const l=isLate(t);const who=getUser(t.who);
      const slot=getTodaySlot(t);
      const isModOpen=STATE.modTask===t.id;
      let taskH=`<div class="task${t.done?' done':l?' late':''}" id="task-${t.id}">
        <button class="ck${t.done?' done':l?' late':''}" onclick="toggleTask(${t.id})">${t.done?'✓':l?'!':''}</button>
        <div class="task-body">
          <div class="task-top">
            <span style="font-size:18px">${t.animal}</span>
            <span class="task-name${t.done?' done':''}">${t.name}</span>
            <span class="badge ${slotBadge(t.slot)}">${slotLabel(t.slot)}</span>
            ${l&&!t.done?'<span class="badge blate">⚠ Retard</span>':''}
          </div>
          <div class="task-meta">👤 ${who?who.prenom:'?'}</div>
          <div class="task-meta">🕐 Plage : <strong style="color:${l?'#ff8080':'var(--green)'}">${slot?slot.pMin+' → '+slot.pMax:'—'}</strong></div>
          ${t.doneAt?`<div class="task-stamp">✅ Effectuée à ${t.doneAt}</div>`:''}
          <div class="task-actions">
            ${!t.done?`<button class="mod-btn" onclick="openMod(${t.id})">✏️ Modifier horaire du jour</button>`:''}
          </div>`;
      if(isModOpen&&!t.done){
        taskH+=`<div class="mod-form">
          <div><label style="font-size:11px;color:var(--text2);font-weight:600">Heure début</label><input class="mfinput" id="mod-min-${t.id}" type="time" value="${slot?slot.pMin:'08:00'}"></div>
          <div><label style="font-size:11px;color:var(--text2);font-weight:600">Heure fin</label><input class="mfinput" id="mod-max-${t.id}" type="time" value="${slot?slot.pMax:'09:00'}"></div>
          <div class="full" style="display:flex;gap:8px;margin-top:4px">
            <button class="mf-save" onclick="saveMod(${t.id})">✅ Valider</button>
            <button class="mf-cancel" onclick="closeMod()">Annuler</button>
          </div>
        </div>`;
      }
      taskH+=`</div></div>`;
      return taskH;
    }).join('');
  }

  h+=`<div class="obs-card${savedObs?' saved':''}">
    <div class="obs-title">📝 Observation de fin de journée <span class="obs-req${savedObs?' ok':''}">${savedObs?'✓ Enregistrée':'Obligatoire'}</span></div>
    <div class="obs-sub">Animaux, incidents, besoins particuliers, remarques pour demain...</div>
    <textarea class="obs-ta" id="obs-ta" placeholder="Ex : Balthazar boite côté avant gauche, à surveiller. Abreuvoir enclos 3 à vérifier...">${savedObs}</textarea>
    <div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap">
      <button class="obs-save" onclick="saveObs()">💾 Enregistrer</button>
      ${savedObs?'<span class="saved-ok">✓ Sauvegardée</span>':''}
    </div>
  </div>`;

  $('view-jour').innerHTML=h;
}

function openMod(id){STATE.modTask=id;renderJour();}
function closeMod(){STATE.modTask=null;renderJour();}
function saveMod(id){
  const t=TASKS.find(x=>x.id===id);if(!t) return;
  const pMin=($('mod-min-'+id)||{value:null}).value;
  const pMax=($('mod-max-'+id)||{value:null}).value;
  if(!pMin||!pMax){alert('Remplis les deux horaires.');return;}
  t.todayOverride={dow:todayDow(),pMin,pMax};
  STATE.modTask=null;renderJour();
  showNotif('✅ Horaire modifié pour aujourd\'hui : '+pMin+' → '+pMax,'warn');
}
function toggleTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t) return;
  t.done=!t.done;t.doneAt=t.done?new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):null;
  STATE.modTask=null;renderJour();
}
function setFilter(f){STATE.filter=f;renderJour();}
function saveObs(){
  const ta=$('obs-ta');if(!ta) return;
  const v=ta.value.trim();if(!v){alert('Saisis une observation avant d\'enregistrer.');return;}
  OBS[todayKey()+STATE.user.id]=v;renderJour();
}

// ── SEMAINE ──────────────────────────────────────────────────────────────────
function renderSemaine(){
  const today=new Date();const dow=today.getDay();
  const mondayOff=dow===0?-6:1-dow;
  const myT=STATE.user.admin?TASKS:TASKS.filter(t=>t.who===STATE.user.id);
  let h=`<div style="font-size:13px;color:var(--text2);margin-bottom:12px">Planning semaine — ${myT.length} tâche${myT.length>1?'s':''}</div>`;
  h+=`<div class="week-wrap"><div class="week-grid">`;
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(today.getDate()+mondayOff+i);
    const isToday=d.toDateString()===today.toDateString();
    const isPast=d<new Date(today.toDateString());
    const dow2=[1,2,3,4,5,6,0][i];
    const dayT=myT.filter(t=>t.days.some(x=>x.dow===dow2));
    h+=`<div class="day-col"><div class="day-hd${isToday?' today':''}">
      <div class="day-dn">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]}</div>
      <div class="day-dt">${d.getDate()}</div>
    </div>`;
    dayT.slice(0,5).forEach(t=>{
      const sl=t.days.find(x=>x.dow===dow2);
      const cls=isToday?(t.done?'dt-ok':isLate(t)?'dt-late':'dt-pend'):isPast?'dt-late':'dt-pend';
      h+=`<div class="day-task ${cls}" title="${t.name} (${sl?sl.pMin+'→'+sl.pMax:''})">${t.animal} ${t.name}</div>`;
    });
    if(dayT.length>5) h+=`<div style="font-size:9px;color:var(--text2);padding:2px 5px">+${dayT.length-5}</div>`;
    if(dayT.length===0) h+=`<div style="font-size:10px;color:var(--text2);padding:6px;text-align:center">Repos</div>`;
    h+=`</div>`;
  }
  h+=`</div></div>
  <div class="week-legend" style="margin-top:10px">
    <div class="leg-item"><div class="leg-dot" style="background:var(--green-l);border:1px solid var(--green)"></div>Effectuée</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--red-l);border:1px solid var(--red)"></div>En retard</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--card2);border:1px solid var(--border)"></div>Planifiée</div>
  </div>`;
  $('view-semaine').innerHTML=h;
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function renderAdmin(){
  let h='';

  h+=`<div class="section-hd">👥 Suivi salariés — aujourd'hui</div>`;
  USERS.filter(u=>!u.admin).forEach(u=>{
    const mt=TASKS.filter(t=>t.who===u.id&&isTaskToday(t));
    const d=mt.filter(t=>t.done).length;const l=mt.filter(t=>isLate(t)).length;
    const obs=OBS[todayKey()+u.id]||'';
    h+=`<div class="emp-card">
      <div class="avatar" style="background:${u.col};color:${u.tc};width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${initials(u.name)}</div>
      <div class="emp-body">
        <div class="emp-name">${u.name}</div>
        <div class="emp-role">${u.role}${u.tel?' · '+u.tel:''}</div>
        <div class="pills">
          <span class="pill pill-g">${d}/${mt.length} tâches</span>
          ${l>0?`<span class="pill pill-r">⚠ ${l} retard</span>`:''}
          ${obs?`<span class="pill pill-g">📝 Obs. OK</span>`:`<span class="pill pill-a">📝 Obs. manquante</span>`}
        </div>
        ${obs?`<div class="obs-read">💬 "${obs}"</div>`:''}
      </div>
    </div>`;
  });

  h+=`<div class="section-hd">🔔 Alertes & notifications</div>
  <div class="alert-box-admin">
    <div class="alert-box-title">📲 Contacts pour les alertes</div>
    <div class="contact-row">
      <span class="contact-label">📱 Téléphone</span>
      <input class="contact-input" id="alert-tel" type="tel" placeholder="06 12 34 56 78" value="${ALERTS.tel}">
      <button class="notif-toggle${ALERTS.smsOn?' on':''}" id="sms-tog" onclick="toggleSms()">${ALERTS.smsOn?'✓ SMS on':'SMS off'}</button>
    </div>
    <div class="contact-row">
      <span class="contact-label">📧 Email</span>
      <input class="contact-input" id="alert-mail" type="email" placeholder="myriam@parc.fr" value="${ALERTS.mail}">
      <button class="notif-toggle${ALERTS.mailOn?' on':''}" id="mail-tog" onclick="toggleMail()">${ALERTS.mailOn?'✓ Mail on':'Mail off'}</button>
    </div>
    <div class="contact-row">
      <span class="contact-label">⏱ Délai retard</span>
      <input class="contact-input" id="alert-delay" type="number" value="${ALERTS.delay}" min="0" max="60" style="width:70px"> min après la plage max
    </div>
    <div class="contact-row">
      <span class="contact-label">📝 Rappel obs.</span>
      <input class="contact-input" id="obs-h" type="time" value="${ALERTS.obsH}" style="width:110px">
      <span style="font-size:12px;color:var(--text2)">si non saisie</span>
    </div>
    <button class="save-contact-btn" onclick="saveAlerts()">💾 Enregistrer</button>
    <div class="info-tip">⚠️ Les alertes visuelles sont actives dans l'appli. Pour SMS/mail réels, connecte un service externe (ex : Twilio, Mailjet). Demande à Claude comment faire.</div>
  </div>`;

  h+=`<div class="section-hd">📋 Tâches du planning</div>`;
  TASKS.forEach(t=>{
    const who=getUser(t.who);
    h+=`<div class="task-param">
      <span style="font-size:20px">${t.animal}</span>
      <div class="task-param-body">
        <div class="task-param-name">${t.name}</div>
        <div class="task-param-meta">👤 ${who?who.prenom:'?'} · ${slotLabel(t.slot)}</div>
        <div class="task-param-days">📅 ${daysLabel(t)}</div>
        <div class="task-param-meta" style="color:var(--text2);font-size:10px">Horaires : ${t.days.map(d=>DAYS_FR[d.dow]+' '+d.pMin+'→'+d.pMax).join(' | ')}</div>
      </div>
      <button class="del-btn" onclick="deleteTask(${t.id})">🗑</button>
    </div>`;
  });

  h+=`<div class="add-form">
    <div class="add-form-title">➕ Ajouter une tâche avec horaires par jour</div>
    <div class="form-grid">
      <div class="full"><label class="flabel">Nom de la tâche</label><input class="finput" id="nt-name" placeholder="Ex : Nourrissage tortues"></div>
      <div><label class="flabel">Salarié</label><select class="fselect" id="nt-who">${USERS.filter(u=>!u.admin).map(u=>`<option value="${u.id}">${u.prenom}</option>`).join('')}</select></div>
      <div><label class="flabel">Créneau</label><select class="fselect" id="nt-slot"><option value="matin">Matin</option><option value="midi">Midi</option><option value="soir">Soir</option><option value="continu">Continu</option></select></div>
      <div><label class="flabel">Emoji animal</label><input class="finput" id="nt-animal" placeholder="🐾" style="font-size:18px"></div>
      <div class="full">
        <label class="flabel">📅 Jours & horaires — coche les jours actifs et règle l'heure pour chacun</label>
        <div style="margin-top:8px" id="days-config">
          ${[{dow:1,l:'Lun'},{dow:2,l:'Mar'},{dow:3,l:'Mer'},{dow:4,l:'Jeu'},{dow:5,l:'Ven'},{dow:6,l:'Sam'},{dow:0,l:'Dim'}].map(d=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
            <input type="checkbox" id="dc-${d.dow}" checked style="width:16px;height:16px;accent-color:var(--green)">
            <label for="dc-${d.dow}" style="font-size:12px;font-weight:600;color:var(--text);width:30px">${d.l}</label>
            <span style="font-size:11px;color:var(--text2)">De</span>
            <input type="time" id="dc-min-${d.dow}" value="08:00" class="mfinput" style="width:90px">
            <span style="font-size:11px;color:var(--text2)">à</span>
            <input type="time" id="dc-max-${d.dow}" value="09:00" class="mfinput" style="width:90px">
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="save-btn gray" onclick="checkAllDays(true)" style="font-size:11px;padding:5px 10px">✓ Tous</button>
          <button class="save-btn gray" onclick="checkWeekDays()" style="font-size:11px;padding:5px 10px">Lun→Ven</button>
          <button class="save-btn gray" onclick="checkAllDays(false)" style="font-size:11px;padding:5px 10px">✗ Aucun</button>
        </div>
      </div>
      <div class="full"><button class="save-btn" onclick="addTask()">✅ Ajouter au planning</button></div>
    </div>
  </div>`;

  h+=`<div class="section-hd">👤 Salariés — gestion</div>`;
  USERS.forEach(u=>{
    h+=`<div class="emp-card">
      <div class="avatar" style="background:${u.col};color:${u.tc};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">${initials(u.name)}</div>
      <div class="emp-body">
        <div class="emp-name">${u.name}${u.admin?' 👑':''}</div>
        <div class="emp-role">${u.role}${u.tel?' · '+u.tel:''}${u.mail?' · '+u.mail:''}</div>
        <div class="pills"><span class="pill pill-b">PIN : ${u.pin}</span>${u.admin?'<span class="pill pill-a">Admin</span>':''}</div>
      </div>
      ${!u.admin?`<button class="del-btn" onclick="deleteUser('${u.id}')">🗑 Supprimer</button>`:''}
    </div>`;
  });

  h+=`<div class="add-form" style="margin-top:10px">
    <div class="add-form-title">➕ Créer un salarié</div>
    <div class="form-grid">
      <div><label class="flabel">Prénom *</label><input class="finput" id="nu-prenom" placeholder="Thomas"></div>
      <div><label class="flabel">Nom</label><input class="finput" id="nu-nom" placeholder="Martin"></div>
      <div><label class="flabel">Rôle / poste *</label><input class="finput" id="nu-role" placeholder="Soigneur animaux"></div>
      <div><label class="flabel">Téléphone</label><input class="finput" id="nu-tel" type="tel" placeholder="06 XX XX XX XX"></div>
      <div class="full"><label class="flabel">Email</label><input class="finput" id="nu-mail" type="email" placeholder="prenom@parc.fr"></div>
      <div><label class="flabel">PIN (4 chiffres) *</label><input class="finput" id="nu-pin" type="number" placeholder="6789" min="0" max="9999"></div>
      <div class="full"><button class="save-btn" onclick="addUser()">✅ Créer le salarié</button></div>
    </div>
  </div>`;

  $('view-admin').innerHTML=h;
}

function checkAllDays(v){[0,1,2,3,4,5,6].forEach(d=>{const el=$('dc-'+d);if(el) el.checked=v;});}
function checkWeekDays(){[0,1,2,3,4,5,6].forEach(d=>{const el=$('dc-'+d);if(el) el.checked=[1,2,3,4,5].includes(d);});}
function toggleSms(){ALERTS.smsOn=!ALERTS.smsOn;const b=$('sms-tog');if(b){b.classList.toggle('on',ALERTS.smsOn);b.textContent=ALERTS.smsOn?'✓ SMS on':'SMS off';}}
function toggleMail(){ALERTS.mailOn=!ALERTS.mailOn;const b=$('mail-tog');if(b){b.classList.toggle('on',ALERTS.mailOn);b.textContent=ALERTS.mailOn?'✓ Mail on':'Mail off';}}
function saveAlerts(){
  ALERTS.tel=($('alert-tel')||{value:''}).value;
  ALERTS.mail=($('alert-mail')||{value:''}).value;
  ALERTS.delay=parseInt(($('alert-delay')||{value:'0'}).value)||0;
  ALERTS.obsH=($('obs-h')||{value:'17:00'}).value;
  showNotif('✅ Paramètres alertes enregistrés','warn');
}
function deleteTask(id){if(!confirm('Supprimer cette tâche ?')) return;TASKS=TASKS.filter(t=>t.id!==id);renderAdmin();}
function addTask(){
  const name=($('nt-name').value||'').trim();
  if(!name){alert('Nom de tâche requis.');return;}
  const days=[];
  [{dow:1},{dow:2},{dow:3},{dow:4},{dow:5},{dow:6},{dow:0}].forEach(({dow})=>{
    const cb=$('dc-'+dow);
    if(cb&&cb.checked){
      const pMin=($('dc-min-'+dow)||{value:'08:00'}).value;
      const pMax=($('dc-max-'+dow)||{value:'09:00'}).value;
      days.push({dow,pMin,pMax});
    }
  });
  if(days.length===0){alert('Sélectionne au moins un jour.');return;}
  TASKS.push({id:nextId++,name,who:$('nt-who').value,slot:$('nt-slot').value,animal:($('nt-animal').value||'🐾').trim()||'🐾',days,done:false,doneAt:null,todayOverride:null});
  renderAdmin();showNotif('✅ Tâche ajoutée au planning','warn');
}
function deleteUser(id){
  const u=USERS.find(x=>x.id===id);if(!u) return;
  if(!confirm('Supprimer '+u.name+' ?')) return;
  USERS=USERS.filter(x=>x.id!==id);renderAdmin();buildLogin();
}
function addUser(){
  const prenom=($('nu-prenom').value||'').trim();
  const nom=($('nu-nom').value||'').trim();
  const role=($('nu-role').value||'').trim();
  const tel=($('nu-tel').value||'').trim();
  const mail=($('nu-mail').value||'').trim();
  const pin=String($('nu-pin').value||'').padStart(4,'0').slice(-4);
  if(!prenom){alert('Prénom obligatoire.');return;}
  if(!/^\d{4}$/.test(pin)){alert('PIN : exactement 4 chiffres.');return;}
  if(USERS.find(u=>u.pin===pin)){alert('Ce PIN est déjà utilisé.');return;}
  const cols=[['#0a2a1a','#1fba85'],['#0a1a3a','#4090e0'],['#2a1a3a','#c090ff'],['#3a1a1a','#ff8080'],['#1a2a0a','#90d040'],['#3a2a10','#e8a020']];
  const [col,tc]=cols[USERS.filter(u=>!u.admin).length%cols.length];
  const id=prenom.toLowerCase().replace(/[^a-z]/g,'')+Date.now().toString().slice(-4);
  USERS.push({id,name:prenom+(nom?' '+nom:''),prenom,role:role||'Salarié',pin,col,tc,admin:false,tel,mail});
  renderAdmin();buildLogin();
  showNotif('✅ '+prenom+' ajouté(e) — PIN : '+pin,'warn');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildLogin();
setInterval(()=>{const el=$('live-time');if(el) el.textContent=formatTime();},30000);
setInterval(()=>{if(STATE.user) checkAlerts();},5*60*1000);
</script>
